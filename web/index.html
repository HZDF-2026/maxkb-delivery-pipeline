<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需求工单</title>
<style>
body{font-family:system-ui,'Microsoft YaHei',sans-serif;max-width:520px;margin:40px auto;padding:0 16px;color:#222}
h1{font-size:20px}
textarea,input[type=file]{width:100%;box-sizing:border-box;margin:8px 0;padding:8px;border:1px solid #ccc;border-radius:6px}
textarea{height:110px}
button{background:#2b6cb0;color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
pre{background:#f5f5f5;padding:10px;border-radius:6px;white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<h1>提交需求工单</h1>
<textarea id="text" placeholder="请描述您的需求，例如：做一个智能问答机器人，名称：小X，知识：产品介绍、价格政策…"></textarea>
<input type="file" id="photos" accept="image/*" multiple>
<button onclick="submit()">提交工单</button>
<pre id="out">填写后点击提交；照片将随工单一并识别。</pre>
<script>
async function submit(){
  const out=document.getElementById('out');
  out.textContent='提交中…';
  const files=[...document.getElementById('photos').files];
  const read=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
  const photos=await Promise.all(files.map(read));
  const res=await fetch('/api/ticket',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('text').value,photos})});
  out.textContent=JSON.stringify(await res.json(),null,2);
}
</script>
</body>
</html>
